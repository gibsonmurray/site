<style>
@import url("https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap");

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Inter", sans-serif;
}

body {
  font-size: 16px;
  line-height: 1.5;
  background-color: #fdfdfc;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  width: 100vw;
}

.cards {
  position: relative;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 20px;
}

.card {
  position: relative;
  width: 160px;
  aspect-ratio: 1;
  border-radius: 20px;
  box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
  cursor: pointer;
  overflow: hidden;

  img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .toggle {
    position: absolute;
    top: 10px;
    right: 10px;
    display: flex;
    justify-content: center;
    align-items: center;
    width: 28px;
    height: 28px;

    .active,
    .inactive {
      position: absolute;
      height: 100%;
      width: 100%;
      border-radius: 9999px;
    }

    .inactive {
      border: 2px solid rgba(255, 255, 255, 0.5);
    }

    .active {
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #000;
      padding: 5px;
      scale: 0;
      opacity: 0;

      .icon {
        color: #fff;
        stroke-width: 3px;
      }
    }
  }
}

.menu {
  position: fixed;
  bottom: 40px;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 5px;
  padding: 5px;
  background-color: #fff;
  border: solid 1px rgba(0, 0, 0, 0.12);
  border-radius: 20px;
  box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);

  filter: blur(4px);
  opacity: 0;

  button {
    border: none;
    background-color: #f9f9f8;
    border-radius: 14px;
    width: 70px;
    height: 70px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 6px;
    color: #8d8d86;
    cursor: pointer;
    transition: all 0.2s;

    .icon {
      width: 18px;
      height: 18px;
      stroke-width: 3px;
    }
  }

  button:hover {
    color: #232323;
  }

  .trash:hover {
    color: #e5484d;
    background-color: #fff7f7;
  }
}

.trashcan {
  display: none;
  filter: blur(10px);
  opacity: 0;
}

.trash-back {
  position: absolute;
  width: 150px;
  height: 150px;
  z-index: -1;
}

.trash-front {
  position: absolute;
  width: 150px;
  height: 150px;
  transform: translateY(-2px);
  z-index: 1;
}

.trash-shadow {
  display: none;
  position: absolute;
  height: 30px;
  width: 140px;
  background-color: rgba(0, 0, 0, 0.2);
  filter: blur(20px);
  border-radius: 9999px;
  transform: translateY(80px);
}

.delete {
  position: absolute;
  color: white;
  background-color: #ff3f40;
  border: none;
  border-radius: 9999px;
  padding: 10px 40px;
  cursor: pointer;
  font-weight: 500;
  bottom: 95px;
  scale: 1.1;
  filter: blur(5px);
  opacity: 0;
  display: none;
}
</style>

<div class="menu">
  <button>
    <i class="icon" data-lucide="move-left"></i>

    <i class="icon" data-lucide="trash"></i>
    <span class="label">Trash</span>
  </button>

<button class="delete">Trash X Photos</button>
  <script src='https://unpkg.com/gsap@3/dist/gsap.min.js'></script>
<script src='https://unpkg.com/lucide@latest'></script>
    <script id="rendered-js" >
lucide.createIcons();

const cards = document.querySelectorAll(".card");
let selectedCards = [];
const rotations = [12, -8, 20, -16];

cards.forEach(card => {
  card.addEventListener("click", () => {
    const activeToggle = card.querySelector(".active");

    if (!selectedCards.includes(card)) {
      selectedCards.push(card);
      card.classList.add("selected");
      gsap.to(activeToggle, {
        opacity: 1,
        scale: 1,
        duration: 0.2,
        ease: "elastic.out(0.9, 1)" });

    } else {
      selectedCards.splice(selectedCards.indexOf(card), 1);
      card.classList.remove("selected");
      gsap.to(activeToggle, {
        opacity: 0,
        scale: 0,
        duration: 0.2,
        ease: "elastic.in(0.9, 1)" });

    }

    if (selectedCards.length > 0) {
      gsap.set(".menu", { display: "flex" });
      gsap.to(".menu", {
        opacity: 1,
        filter: "blur(0px)",
        duration: 0.3,
        y: -30 });

    } else {
      gsap.to(".menu", {
        opacity: 0,
        filter: "blur(4px)",
        duration: 0.3,
        y: 0 });

    }

    const deleteBtn = document.querySelector(".delete");
    deleteBtn.textContent = `Delete ${selectedCards.length} ${
    selectedCards.length > 1 ? "Cards" : "Card"
    }`;
  });
});

const trashBtn = document.querySelector(".trash");
trashBtn.addEventListener("click", () => {
  gsap.
  timeline().
  to(
  ".menu",
  {
    opacity: 0,
    filter: "blur(4px)",
    y: 0,
    ease: "power2.out" },

  0).

  set(".menu", { display: "none" }).
  set(".delete", { display: "block" }, 0).
  to(
  ".delete",
  {
    opacity: 1,
    filter: "blur(0px)",
    scale: 1,
    duration: 0.3,
    ease: "elastic.in(0.8, 0.8)" },

  0).

  set(
  ".selected",
  {
    zIndex: 2 },

  0).

  set(
  ".toggle",
  {
    opacity: 0 },

  0).

  set(
  ".card:not(.selected)",
  {
    opacity: 0,
    pointerEvents: "none" },

  0).

  set(
  ".trashcan, .trash-shadow",
  {
    display: "block",
    scale: 1.2 },

  0).

  to(
  ".trashcan",
  {
    scale: 1,
    opacity: 1,
    filter: "blur(0px)",
    duration: 0.2 },

  0).

  to(
  ".selected",
  {
    scale: 0.65,
    ease: "elastic.out(0.9, 1)",
    cursor: "default",
    duration: 0.5 },

  0).

  add(applyRotations, 0).
  to(
  ".selected.c1",
  {
    x: 90,
    y: -60,
    duration: 0.5,
    ease: "elastic.out(1, 2)" },

  0).

  to(
  ".selected.c2",
  {
    x: -90,
    y: -60,
    duration: 0.5,
    ease: "elastic.out(1, 2)" },

  0).

  to(
  ".selected.c3",
  {
    x: 90,
    y: -250,
    duration: 0.5,
    ease: "elastic.out(1, 2)" },

  0).

  to(
  ".selected.c4",
  {
    x: -90,
    y: -250,
    duration: 0.5,
    ease: "elastic.out(1, 2)" },

  0).

  set(
  ".selected",
  {
    zIndex: 0 },

  "-=0.35").

  to(
  ".selected",
  {
    y: "+=95",
    ease: "elastic.out(1, 0.7)",
    duration: 0.5 },

  "-=0.35");

});

function applyRotations() {
  selectedCards.forEach((card, index) => {
    gsap.to(card, {
      rotate: rotations[index],
      duration: 0.5,
      ease: "elastic.out(1, 2)" });

  });
}

const deleteBtn = document.querySelector(".delete");
deleteBtn.addEventListener("click", () => {
  gsap.
  timeline().
  to(".selected", {
    y: "+=65",
    ease: "elastic.in(1, 0.7)" }).

  set(".selected", {
    opacity: 0 }).

  to(
  ".trashcan, .trash-shadow, .delete",
  {
    opacity: 0,
    scale: 1.2,
    duration: 0.3,
    ease: "power2.in" },

  "+=1").

  set(".trashcan, .trash-shadow, .delete", {
    display: "none" }).

  set(".selected", {
    rotate: 0,
    scale: 1,
    x: 0,
    y: 0,
    zIndex: 0 }).

  set(".card", {
    cursor: "pointer",
    pointerEvents: "auto",
    filter: "blur(10px)" }).

  add(reset).
  to(".card, .toggle", {
    filter: "blur(0px)",
    opacity: 1,
    duration: 0.3 });

});

function reset() {
  selectedCards.forEach(card => {
    card.classList.remove("selected");
    const activeToggle = card.querySelector(".active");
    gsap.set(activeToggle, {
      opacity: 0,
      scale: 0 });

  });
  selectedCards = [];
}

  </script>

  
</body>
